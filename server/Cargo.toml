[package]
name = "dsv41-developer-server"
version = "0.1.0-dev"
edition = "2024"
publish = false
build = "build.rs"

[features]
default = []
native-bridge = []
native-model = ["native-bridge", "recipe-adapter"]
recipe-adapter = ["dep:deepseek-recipe-core", "dep:deepseek-recipe-encoding", "dep:deepseek-recipe", "dep:tokenizers"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
async-stream = "0.3"
tokio-stream = "0.1"

deepseek-recipe-core = { path = "../third_party/deepseek-recipe/deepseek-recipe-core", optional = true }
deepseek-recipe-encoding = { path = "../third_party/deepseek-recipe/deepseek-recipe-encoding", optional = true }
tokenizers = { version = "0.23", optional = true }
deepseek-recipe = { path = "../third_party/deepseek-recipe/deepseek-recipe", optional = true }
